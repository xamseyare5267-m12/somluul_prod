<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress benign Vite websocket/HMR connection errors in sandboxed preview frames
      (function() {
        const isViteWebsocketError = (msg) => {
          if (!msg) return false;
          const str = String(msg).toLowerCase();
          return str.includes('vite') || str.includes('websocket') || str.includes('web socket') || str.includes('failed to connect');
        };

        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args[0] && isViteWebsocketError(args[0])) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && (isViteWebsocketError(event.message) || isViteWebsocketError(event.filename))) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = String(event.reason.message || event.reason).toLowerCase();
            if (isViteWebsocketError(reasonStr)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Dev: unregister SW so Vite modules are never served from a stale cache.
      // Production: register PWA service worker.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocal =
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname === '[::1]';
          if (isLocal) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((r) => r.unregister());
            });
            if (window.caches) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
            }
            console.log('ServiceWorker disabled on localhost (dev mode)');
            return;
          }
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('ServiceWorker registered:', reg.scope))
            .catch(err => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
